        function convertToKana(input, targetType = 'hiragana') {
            let text = input.toLowerCase();
            text = text.replace(/([bcdfghjklmnpqrstvwxyz])\1/g, function(match, consonant) {
                if (consonant === 'n') return 'んn';
                return 'っ' + consonant;
            });
            const keys = Object.keys(kanaMap).sort((a, b) => b.length - a.length);
            keys.forEach(key => {
                const regex = new RegExp(key, 'g');
                text = text.replace(regex, kanaMap[key]);
            });
            text = text.replace(/n(?=[^aiueontskcshgzdbpmryj]|$)/g, 'ん');
            if (targetType === 'katakana') {
                text = hiraganaToKatakana(text);
            }
            return text;
        }

        function hiraganaToKatakana(hiraganaStr) {
            return hiraganaStr.replace(/[\u3041-\u3096]/g, function(match) {
                let chr = match.charCodeAt(0) + 0x60;
                return String.fromCharCode(chr);
            });
        }

        function getSavedWords() {
            const data = localStorage.getItem('saved_words');
            return data ? JSON.parse(data) : {};
        }

        function saveWordToSavedWords(kanji, romaji, meaning, tags) {
            if (!kanji) return;
            let savedWords = getSavedWords();
            if (savedWords[kanji]) return;

            savedWords[kanji] = {
                level: 1,
                timestamp: Date.now(),
                romaji: romaji || '',
                meaning: meaning || '',
                tags: tags || '',
                active: true
            };
            localStorage.setItem('saved_words', JSON.stringify(savedWords));
        }

        function saveAllWords() {
            if (!wordDetailsCache || wordDetailsCache.length === 0) return;
            let savedWords = getSavedWords();

            wordDetailsCache.forEach(word => {
                const kanji = word.word_kanji;
                if (kanji && !savedWords[kanji]) {
                    savedWords[kanji] = {
                        level: 1,
                        timestamp: Date.now(),
                        romaji: word.word_romaji || '',
                        meaning: word.meaning || '',
                        tags: word.tags || '',
                        active: true
                    };
                }
            });

            localStorage.setItem('saved_words', JSON.stringify(savedWords));
            
            document.querySelectorAll('.vocab-save-btn').forEach(btn => {
                if(!btn.disabled) {
                    btn.innerText = "✓ Kayıtlı";
                    btn.className = "vocab-save-btn px-3 py-1.5 rounded-xl text-xs font-semibold bg-emerald-100 text-emerald-700 cursor-default shrink-0";
                    btn.disabled = true;
                }
            });

            const topSaveBtn = document.getElementById('saveAllBtn');
            if(topSaveBtn) {
                topSaveBtn.innerText = "✓ Tüm Kelimeler Kaydedildi";
                topSaveBtn.className = "px-3 py-1.5 bg-emerald-100 text-emerald-700 text-xs font-semibold rounded-xl cursor-default transition";
                topSaveBtn.disabled = true;
            }
        }

        async function fetchRandomPicture() {
            try {
                const { data, error } = await _supabase.from('pictures').select('*');
                if (error || !data || data.length === 0) {
                    document.getElementById('mainContainer').innerHTML = `
                        <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm text-center">
                            <div class="text-3xl mb-2">⚠️</div>
                            <p class="text-xs text-slate-500 font-medium">Tabloda hiç kayıt bulunamadı veya bir hata oluştu.</p>
                        </div>
                    `;
                    return;
                }

                const randomIndex = Math.floor(Math.random() * data.length);
                currentPictureData = data[randomIndex];
                const publicUrl = _supabase.storage.from('pictures').getPublicUrl(currentPictureData.file_name).data.publicUrl;

                let kanjiList = [];
                if (currentPictureData.vocabulary) {
                    if (Array.isArray(currentPictureData.vocabulary)) {
                        kanjiList = currentPictureData.vocabulary.map(k => k.trim()).filter(k => k);
                    } else if (typeof currentPictureData.vocabulary === 'string') {
                        kanjiList = currentPictureData.vocabulary.split(',').map(k => k.trim()).filter(k => k);
                    }
                }

                if (kanjiList.length > 0) {
                    try {
                        const response = await fetch('/api/word-details', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ kanjis: kanjiList })
                        });
                        const rawWords = await response.json();
                        
                        const uniqueMap = new Map();
                        rawWords.forEach(w => {
                            if (w.word_kanji && !uniqueMap.has(w.word_kanji)) {
                                uniqueMap.set(w.word_kanji, w);
                            }
                        });
                        wordDetailsCache = Array.from(uniqueMap.values());

                    } catch (e) {
                        wordDetailsCache = [];
                    }
                } else {
                    wordDetailsCache = [];
                }

                renderUI(publicUrl, currentPictureData);
            } catch (err) {
                console.error(err);
            }
        }

        function setupKanaListeners() {
            const inputs = document.querySelectorAll('textarea');
            inputs.forEach(textarea => {
                textarea.addEventListener('focus', function() {
                    activeTextarea = this;
                });
                textarea.addEventListener('keydown', function(e) {
                    activeTextarea = this;
                    if (!isMobileDevice() && (e.key === ' ' || e.key === 'l' || e.key === 'L')) {
                        e.preventDefault();
                        const targetType = (e.key === 'l' || e.key === 'L') ? 'katakana' : 'hiragana';
                        const cursorPos = this.selectionStart;
                        const val = this.value;
                        let leftPart = val.substring(0, cursorPos);
                        let rightPart = val.substring(cursorPos);
                        let words = leftPart.split(' ');
                        let lastWord = words.pop();
                        if (lastWord.trim() !== '') {
                            let convertedWord = convertToKana(lastWord, targetType);
                            words.push(convertedWord);
                        }
                        let newLeftPart = words.join(' ') + ' ';
                        this.value = newLeftPart + rightPart;
                        let newCursorPos = newLeftPart.length;
                        this.setSelectionRange(newCursorPos, newCursorPos);
                    }
                });
            });

            if (inputs.length > 0 && !activeTextarea) {
                activeTextarea = inputs[0];
            }
        }

        function convertActiveTextarea(targetType) {
            if (!activeTextarea) return;
            const cursorPos = activeTextarea.selectionStart;
            const val = activeTextarea.value;
            let leftPart = val.substring(0, cursorPos);
            let rightPart = val.substring(cursorPos);
            let words = leftPart.split(' ');
            let lastWord = words.pop();
            if (lastWord.trim() !== '') {
                let convertedWord = convertToKana(lastWord, targetType);
                words.push(convertedWord);
            }
            activeTextarea.value = words.join(' ') + (words.length > 0 ? ' ' : '') + rightPart;
            activeTextarea.focus();
        }

        function clearActiveTextarea() {
            if (!activeTextarea) return;
            activeTextarea.value = '';
            activeTextarea.focus();
        }

                if (typeof helpList === 'string') {

                    questionsContainer.innerHTML = `<p class="text-xs text-slate-400">Bu görsel için eklenmiş ipucu sorusu bulunmuyor.</p>`;
                    return;
                }

                helpList.forEach((q, index) => {
                    questionsContainer.innerHTML += `
                        <div class="space-y-2 bg-white sm:bg-slate-50 p-3 rounded-xl border border-slate-200">
                            <label class="block text-xs font-bold text-slate-700">${index + 1}. ${escapeHtml(q)}</label>
                            <textarea class="help-textarea w-full p-2.5 rounded-lg border border-slate-200 text-xs bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 leading-relaxed resize-none" rows="2" placeholder="Buraya yanıtınızı yazın..."></textarea>
                            
                            <div class="flex md:hidden flex-wrap items-center justify-between gap-1 pt-1 bg-slate-50 p-2 rounded-lg border border-slate-200">
                                <div class="flex items-center gap-1 flex-wrap">
                                    <button type="button" onclick="convertSpecificTextarea(this, 'hiragana')" class="px-2 py-0.5 bg-indigo-50 border border-indigo-200 text-indigo-700 rounded text-[11px] font-bold">Hiragana Yap</button>
                                    <button type="button" onclick="convertSpecificTextarea(this, 'katakana')" class="px-2 py-0.5 bg-purple-50 border border-purple-200 text-purple-700 rounded text-[11px] font-bold">Katakana Yap</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                setupKanaListeners();

            } else {
                helpWrapper.classList.add('hidden');
                singleWrapper.classList.remove('hidden');
                helpBtn.className = "px-3 py-1.5 bg-pink-50 hover:bg-pink-100 text-pink-700 text-xs font-semibold rounded-xl transition cursor-pointer flex items-center gap-1";
                helpBtn.innerHTML = `<span>💡</span> <span>İpucu Ver</span>`;
                setupKanaListeners();
            }
        }

        function convertSpecificTextarea(btn, targetType) {
            const ta = btn.closest('.space-y-2').querySelector('textarea');
            if (ta) {
                activeTextarea = ta;
                ta.focus();
                convertActiveTextarea(targetType);
            }
        }

        async function askAI() {
            if (!currentPictureData) {
                alert("Önce görsel yüklenmelidir.");
                return;
            }

            const helpWrapper = document.getElementById('helpQuestionsWrapper');
            const isHelpMode = !helpWrapper.classList.contains('hidden');

            let mode = "normal_description";
            let userContent = "";

            if (isHelpMode) {
                mode = "help_questions";
                const textareas = helpWrapper.querySelectorAll('.help-textarea');
                let answers = [];
                textareas.forEach((ta, index) => {
                    answers.push({
                        questionIndex: index + 1,
                        answer: ta.value.trim()
                    });
                });
                userContent = answers;
                
                if (answers.every(a => a.answer === '')) {
                    alert("Lütfen en az bir soruya yanıt yazın.");
                    return;
                }
            } else {
                const mainInput = document.getElementById('mainDescInput');
                userContent = mainInput ? mainInput.value.trim() : "";

                if (!userContent) {
                    alert("Lütfen görseli betimleyen bir şeyler yazın.");
                    return;
                }
            }

            const aiButtons = document.querySelectorAll('button');
            let aiButton = null;
            aiButtons.forEach(btn => {
                if (btn.innerText.includes('AI Kontrol')) aiButton = btn;
            });

            let originalText = "";
            if (aiButton) {
                originalText = aiButton.innerHTML;
                aiButton.disabled = true;
                aiButton.innerHTML = `<span>⏳</span> <span>Yapay zeka değerlendiriyor...</span>`;
            }

            try {
                const imageUrl = _supabase.storage.from('pictures').getPublicUrl(currentPictureData.file_name).data.publicUrl;

                const response = await fetch(EDGE_FUNCTION_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    },
                    body: JSON.stringify({
                        imageUrl: imageUrl,
                        mode: mode,
                        userContent: userContent
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Bir hata oluştu.');
                }

                showAIFeedbackModal(result.feedback, result.remaining);

            } catch (err) {
                alert("Hata: " + err.message);
            } finally {
                if (aiButton) {
                    aiButton.disabled = false;
                    aiButton.innerHTML = originalText;
                }
            }
        }

        function showAIFeedbackModal(feedbackText, remainingCount) {
            const existingModal = document.getElementById('aiFeedbackModal');
            if (existingModal) existingModal.remove();

            const formattedFeedback = escapeHtml(feedbackText).replace(/\n/g, '<br>');

            const modalHtml = `
                <div id="aiFeedbackModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 space-y-4 animate-in fade-in zoom-in duration-200">
                        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                            <div class="flex items-center gap-2">
                                <span class="text-xl">🤖</span>
                                <h3 class="font-bold text-sm text-slate-900">Yapay Zeka Değerlendirmesi</h3>
                            </div>
                            <span class="text-[11px] bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-lg font-semibold">Bugünkü Kalan Hak: ${remainingCount}</span>
                        </div>
                        
                        <div class="max-h-80 overflow-y-auto text-xs text-slate-700 leading-relaxed space-y-2 pr-1 font-medium bg-slate-50 p-4 rounded-xl border border-slate-100">
                            ${formattedFeedback}
                        </div>

                        <div class="flex items-center justify-end pt-2">
                            <button onclick="document.getElementById('aiFeedbackModal').remove()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-xl transition cursor-pointer shadow-sm">
                                Harika, Anladım 🌸
                            </button>
                        </div>
                    </div>
                </div>
            `;

            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        function handleSingleSave(kanji, romaji, meaning, tags, btnElement) {
            saveWordToSavedWords(kanji, romaji, meaning, tags);
            btnElement.innerText = "✓ Kayıtlı";
            btnElement.className = "vocab-save-btn px-3 py-1.5 rounded-xl text-xs font-semibold bg-emerald-100 text-emerald-700 cursor-default shrink-0";
            btnElement.disabled = true;
        }

        function toggleQuickDict() {
            const panel = document.getElementById('quickDictPanel');
            const isOpen = panel.classList.contains('translate-x-0');
            if (isOpen) {
                panel.classList.remove('translate-x-0');
                panel.classList.add('translate-x-full');
                document.getElementById('dictSearchInput').value = '';
                document.getElementById('googleTranslateWrapper').classList.add('hidden');
                document.getElementById('dictResultsContainer').innerHTML = `<p class="text-xs text-slate-400 text-center py-10">Arama yapmak için yukarıya bir şeyler yazın...</p>`;
                
                setTimeout(() => {
                    if (activeTextarea) {
                        activeTextarea.focus();
                    } else {
                        const firstTA = document.querySelector('textarea');
                        if (firstTA) firstTA.focus();
                    }
                }, 100);

            } else {
                panel.classList.remove('translate-x-full');
                panel.classList.add('translate-x-0');
                document.getElementById('dictSearchInput').focus();
            }
        }

        // Q tuşunun güvenli kontrolü (Stack overflow hatasını önleyen versiyon)
        window.addEventListener('keydown', function(e) {
            if (e.key === 'q' || e.key === 'Q') {
                const activeEl = document.activeElement;
                const isInputOrTextarea = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA');
                const isDictSearch = activeEl && activeEl.id === 'dictSearchInput';

                if (!isInputOrTextarea || isDictSearch) {
                    e.preventDefault();
                    toggleQuickDict();
                }
            }
        }, true);

        window.addEventListener('click', function(e) {
            const panel = document.getElementById('quickDictPanel');
            const isOpen = panel.classList.contains('translate-x-0');
            if (isOpen) {
                const isClickInside = panel.contains(e.target) || e.target.closest('button[onclick="toggleQuickDict()"]');
                if (!isClickInside) {
                    toggleQuickDict();
                }
            }
        });

        let searchTimeout = null;
        function searchInDictionary(query) {
            const trimmedQuery = query.trim();
            const googleWrapper = document.getElementById('googleTranslateWrapper');
            const googleLink = document.getElementById('googleTranslateLink');
            const resultsContainer = document.getElementById('dictResultsContainer');

            if (trimmedQuery.length > 0) {
                googleWrapper.classList.remove('hidden');
                googleLink.href = `https://translate.google.com/?sl=tr&tl=ja&text=${encodeURIComponent(trimmedQuery)}&op=translate`;
            } else {
                googleWrapper.classList.add('hidden');
                resultsContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-10">Arama yapmak için yukarıya bir şeyler yazın...</p>`;
                return;
            }

            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                resultsContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-10">Aranıyor...</p>`;
                fetch(`/api/search?q=${encodeURIComponent(trimmedQuery)}`)
                    .then(response => response.json())
                    .then(data => {
                        resultsContainer.innerHTML = '';
                        if (data.length === 0) {
                            resultsContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-10">Sonuç bulunamadı.</p>`;
                            return;
                        }
                        let savedWords = getSavedWords();
                        data.forEach(item => {
                            const kanji = item.word_kanji || item.kanji || '';
                            const kana = item.word_kana || item.kana || '';
                            const romaji = item.word_romaji || item.romaji || '';
                            const meaning = item.meaning || '';
                            const pos = item.pos || 'Kelime';
                            const isSaved = savedWords[kanji] !== undefined;

                            resultsContainer.innerHTML += `
                                <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm space-y-2 text-xs">
                                    <div class="flex items-start justify-between">
                                        <div>
                                            <span class="font-bold text-sm text-indigo-600">${kanji}</span>
                                            <span class="text-slate-500 ml-2 font-medium">${kana ? `(${kana})` : ''}</span>
                                            <span class="text-slate-400 ml-1 text-[11px]">${romaji ? `[${romaji}]` : ''}</span>
                                        </div>
                                        <div class="flex items-center gap-2">
                                            <span class="bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded text-[10px] font-semibold">${pos}</span>
                                            <button onclick='saveWordToSavedWords(${JSON.stringify(kanji)}, ${JSON.stringify(romaji)}, ${JSON.stringify(meaning)}, ""); this.className="px-2.5 py-1 bg-emerald-100 text-emerald-700 text-[11px] font-semibold rounded-lg cursor-default"; this.disabled=true; this.innerText="✓ Kaydedildi";' 
                                                class="${isSaved ? 'px-2.5 py-1 bg-emerald-100 text-emerald-700 text-[11px] font-semibold rounded-lg cursor-default' : 'px-2.5 py-1 bg-indigo-600 hover:bg-indigo-700 text-white text-[11px] font-semibold rounded-lg transition cursor-pointer'}"
                                                ${isSaved ? 'disabled' : ''}>
                                                ${isSaved ? '✓ Kaydedildi' : '＋ Ekle'}
                                            </button>
                                        </div>
                                    </div>
                                    <div class="text-slate-700 font-medium border-t border-slate-100 pt-1.5">
                                        <span class="text-slate-400 font-normal">Anlam:</span> ${meaning}
                                    </div>
                                </div>
                            `;
                        });
                    }).catch(() => {
                        resultsContainer.innerHTML = `<p class="text-xs text-rose-500 text-center py-10">Arama yapılırken hata oluştu.</p>`;
                    });
            }, 300);
        }

        function escapeHtml(str) {
            return str ? str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            ) : '';
        }

        fetchRandomPicture();
    </script>
</body>
</html>
