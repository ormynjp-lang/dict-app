<!DOCTYPE html>
<html lang="tr">
<head>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japonca Öğrenme Paneli</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --border-color: #e2e8f0;
            --border-light: #f1f5f9;
            --indigo-primary: #4f46e5;
            --indigo-bg: #e0e7ff;
            --emerald-primary: #059669;
            --emerald-bg: #d1fae5;
            --rose-primary: #e11d48;
            --rose-bg: #ffe4e6;
            --amber-primary: #d97706;
            --amber-bg: #fef3c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 0 2rem 0;
            overflow-x: hidden;
        }

        .hidden { display: none !important; }
        .rotate-180 { transform: rotate(180deg); }

        /* Navbar / Header */
        header {
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 40;
            padding: 1rem;
            margin-bottom: 1.25rem;
        }

        @media (min-width: 768px) {
            header { padding: 1rem 2rem; }
        }

        .nav-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-icon {
            font-size: 1.35rem;
            padding: 0.45rem;
            background: #e0e7ff;
            border-radius: 0.75rem;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* İçerik Sekme Grubu (Genel) */
        .content-tab-group {
            display: flex;
            background: #f1f5f9;
            padding: 0.25rem;
            border-radius: 0.75rem;
            font-size: 0.75rem;
            font-weight: 500;
            border: 1px solid var(--border-color);
        }

        .content-tab-btn {
            flex: 1;
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-family: inherit;
            font-weight: 600;
        }

        .content-tab-btn.active {
            background: #ffffff;
            color: var(--indigo-primary);
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.08);
        }
        .content-tab-btn:hover:not(.active) { color: var(--text-dark); }

        /* Mobil Görünüm Değiştirici Sekmeler */
        .mobile-view-switcher {
            display: flex;
            width: 100%;
            background: var(--border-color);
            padding: 0.25rem;
            border-radius: 0.75rem;
            margin-bottom: 1rem;
        }

        .mobile-view-btn {
            flex: 1;
            padding: 0.625rem;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 700;
            border: none;
            background: transparent;
            color: var(--text-muted);
            border-radius: 0.5rem;
            cursor: pointer;
            font-family: inherit;
        }

        .mobile-view-btn.active {
            background: #ffffff;
            color: var(--indigo-primary);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        @media (min-width: 1024px) {
            .mobile-view-switcher { display: none !important; }
        }

        /* Layout Grid */
        .grid-layout {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.25rem;
            align-items: start;
            padding: 0 1rem;
        }

        @media (min-width: 1024px) {
            .grid-layout { grid-template-columns: repeat(12, 1fr); }
            .col-span-7 { grid-column: span 7; }
            .col-span-5 { grid-column: span 5; }
        }

        @media (max-width: 1023px) {
            .mobile-hidden-pane { display: none !important; }
        }

        /* Search Input */
        .search-wrapper {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 2.75rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05);
            outline: none;
            background: #ffffff;
            font-size: 1rem;
            font-family: inherit;
            color: var(--text-main);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: var(--indigo-primary);
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
        }

        .search-icon {
            width: 1.25rem;
            height: 1.25rem;
            color: var(--text-light);
            position: absolute;
            left: 0.875rem;
            top: 1rem;
        }

        /* Cards & Panels */
        .card {
            background: var(--card-bg);
            padding: 1rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 3px 0 rgba(0,0,0,0.05);
        }

        .card-padded {
            background: var(--card-bg);
            padding: 1.25rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 3px 0 rgba(0,0,0,0.05);
        }

        .sticky-sidebar {
            position: sticky;
            top: 5rem;
        }

        /* Buttons & Actions */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.375rem;
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            font-family: inherit;
        }

        .btn-emerald { background: var(--emerald-primary); color: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .btn-emerald:hover { background: #047857; }

        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
            font-size: 0.75rem;
            padding: 0.5rem 0.875rem;
            border-radius: 0.75rem;
        }
        .btn-secondary:hover { background: #e2e8f0; }

        .btn-indigo-light {
            background: var(--indigo-bg);
            color: var(--indigo-primary);
            border: 1px solid #c7d2fe;
            padding: 0.375rem 0.625rem;
            border-radius: 0.5rem;
        }
        .btn-indigo-light:hover { background: var(--indigo-primary); color: #fff; }

        .btn-rose-light {
            background: var(--rose-bg);
            color: var(--rose-primary);
            border: 1px solid #fecdd3;
            padding: 0.375rem 0.625rem;
            border-radius: 0.5rem;
        }
        .btn-rose-light:hover { background: var(--rose-primary); color: #fff; }

        /* Badges & Helpers */
        .badge {
            font-size: 0.6875rem;
            padding: 0.125rem 0.5rem;
            border-radius: 9999px;
            font-weight: 600;
            display: inline-block;
        }
        .badge-indigo { background: var(--indigo-bg); color: var(--indigo-primary); }
        .badge-emerald { background: var(--emerald-bg); color: var(--emerald-primary); }
        .badge-amber { background: var(--amber-bg); color: var(--amber-primary); }

        .saved-list-container {
            max-height: calc(100vh - 18rem);
            overflow-y: auto;
            padding-right: 0.125rem;
        }
        @media (max-width: 1023px) {
            .saved-list-container { max-height: calc(100vh - 22rem); }
        }

        .pack-list-container {
            max-height: 16rem;
            overflow-y: auto;
        }

        .results-scroll-area {
            min-height: 350px;
        }

        .tag-filter-btn {
            background: #f1f5f9;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 0.25rem 0.625rem;
            border-radius: 9999px;
            font-size: 0.6875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .tag-filter-btn.active {
            background: var(--indigo-primary);
            color: #fff;
            border-color: var(--indigo-primary);
        }

        /* Modal / İşlem Kutusu Stilleri */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-card {
            background: #ffffff;
            padding: 1.5rem;
            border-radius: 1rem;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .text-xs { font-size: 0.75rem; }
        .text-sm { font-size: 0.875rem; }
        .text-base { font-size: 1rem; }
        .font-bold { font-weight: 700; }
        .font-medium { font-weight: 500; }
        .text-muted { color: var(--text-muted); }
        .text-dark { color: var(--text-dark); }
        
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .gap-2 { gap: 0.5rem; }
        .gap-4 { gap: 1rem; }
        .space-y-2 > * + * { margin-top: 0.5rem; }
        .space-y-3 > * + * { margin-top: 0.75rem; }
    </style>
</head>
<body>

    <!-- Navbar / Header -->
    <header>
        <div class="nav-container">
            <a href="/" style="text-decoration: none; color: inherit;">
            <div class="brand-container">
                <span class="brand-icon">🌸</span>
                <div>
                    <h1 class="font-bold text-dark text-base" style="line-height: 1.2;">Ormyn</h1>
                </div>
            </div>
            </a>
            <div class="nav-actions">
                <a href="/" class="btn btn-secondary">Ana Sayfa</a>
                <a href="/quiz" class="btn btn-emerald">⚡ Etkinlik</a>
            </div>
        </div>
    </header>

    <!-- Mobil Ana Görünüm Değiştirici -->
    <div style="width: 100%; max-width: 1200px; padding: 0 1rem;">
        <div class="mobile-view-switcher">
            <button onclick="switchMobileTab('saved')" id="mobTabSaved" class="mobile-view-btn active">📌 Kayıtlı Kelimelerim</button>
            <button onclick="switchMobileTab('search')" id="mobTabSearch" class="mobile-view-btn">🔍 Sözlük & Paketler</button>
        </div>
    </div>

    <!-- Main Layout Container -->
    <div class="grid-layout">

        <!-- LEFT COLUMN: Dynamic View -->
        <div id="leftPane" class="col-span-7 flex flex-col gap-4 mobile-hidden-pane">
            
            <div class="content-tab-group">
                <button onclick="switchView('dictionary')" id="tabDictionary" class="content-tab-btn active">📖 Sözlük</button>
                <button onclick="switchView('packs')" id="tabPacks" class="content-tab-btn">📦 Paketler</button>
            </div>

            <!-- VIEW 1: Dictionary Search -->
            <div id="viewDictionary" class="flex flex-col gap-4">
                <div class="search-wrapper">
                    <input type="text" id="searchInput" placeholder="Kanji, Romaji, anlam veya etiket..." class="search-input">
                    <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <div id="resultsContainer" class="space-y-3 results-scroll-area"></div>
            </div>

            <!-- VIEW 2: Word Packs -->
            <div id="viewPacks" class="hidden flex flex-col gap-3">
                <div class="card-padded">
                    <h2 class="font-bold text-sm text-dark">Kelime Paketleri</h2>
                    <p class="text-xs text-muted">Etiketlere göre gruplandırılmış kelime havuzu.</p>
                </div>
                <div id="packsContainer" class="space-y-3 results-scroll-area"></div>
            </div>

        </div>

        <!-- RIGHT COLUMN: Saved Words Panel -->
        <div id="rightPane" class="col-span-5 card-padded sticky-sidebar" style="overflow: hidden; width: 100%;">
            <div class="flex justify-between items-center" style="margin-bottom: 0.75rem; padding-bottom: 0.625rem; border-bottom: 1px solid var(--border-light);">
                <div class="flex items-center gap-2">
                    <h2 class="font-bold text-sm text-dark">Kelimelerin</h2>
                    <span id="savedCountBadge" class="badge badge-indigo" style="font-weight: 600;">0</span>
                </div>
                <button onclick="toggleActiveStatusForSelectedTag()" class="btn btn-secondary" style="font-size: 0.65rem; padding: 0.25rem 0.5rem;" title="Listelenenleri aktif, diğerlerini pasif yapar">Burayı seç</button>
            </div>
            
            <div id="savedTagFiltersContainer" class="flex items-center gap-1" style="overflow-x: auto; padding-bottom: 0.5rem; margin-bottom: 0.5rem; border-bottom: 1px solid var(--border-light);"></div>

            <!-- Kayıtlı kelimeler liste alanı + Sonsuz kaydırma dinleyicisi -->
            <div id="savedWordsContainer" class="space-y-2 saved-list-container" onscroll="handleSavedScroll(this)"></div>
        </div>

    </div>

    <!-- TOPLU EKLEME / İŞLEM MODALI -->
    <div id="processModal" class="modal-overlay hidden">
        <div class="modal-card text-center space-y-3">
            <div class="font-bold text-dark text-base" id="modalTitle">Paket Ekleniyor...</div>
            <div class="text-xs text-muted" id="modalDesc">Lütfen bekleyin, 800+ kelime hızlıca işleniyor.</div>
            <div style="width: 100%; background: var(--border-light); height: 8px; border-radius: 4px; overflow: hidden; margin-top: 1rem;">
                <div id="modalProgressBar" style="width: 0%; background: var(--indigo-primary); height: 100%; transition: width 0.1s;"></div>
            </div>
            <div class="text-xs font-bold text-indigo-primary" id="modalProgressText">0 / 0</div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        let currentView = 'dictionary';
        let allWordsCache = [];
        let currentSavedTagFilter = 'ALL';
        let packsLoadedOnce = false;
        let openPacksState = new Set();

        // SAĞ PANEL SANAL KAYDIRMA (LAZY LOAD) DEĞİŞKENLERİ
        let savedVisibleLimit = 40; // Başlangıçta sadece ilk 40 tanesi DOM'a basılır (Donmayı engeller)
        const savedBatchSize = 40;

        function switchView(view) {
            currentView = view;
            const dictView = document.getElementById('viewDictionary');
            const packsView = document.getElementById('viewPacks');
            const tabDict = document.getElementById('tabDictionary');
            const tabPacks = document.getElementById('tabPacks');

            if (view === 'dictionary') {
                dictView.classList.remove('hidden');
                packsView.classList.add('hidden');
                tabDict.classList.add('active');
                tabPacks.classList.remove('active');
            } else {
                dictView.classList.add('hidden');
                packsView.classList.remove('hidden');
                tabPacks.classList.add('active');
                tabDict.classList.remove('active');
                loadWordPacks();
            }
        }

        function switchMobileTab(tab) {
            const leftPane = document.getElementById('leftPane');
            const rightPane = document.getElementById('rightPane');
            const mobTabSearch = document.getElementById('mobTabSearch');
            const mobTabSaved = document.getElementById('mobTabSaved');

            if (tab === 'search') {
                leftPane.classList.remove('mobile-hidden-pane');
                rightPane.classList.add('mobile-hidden-pane');
                mobTabSearch.classList.add('active');
                mobTabSaved.classList.remove('active');
            } else {
                leftPane.classList.add('mobile-hidden-pane');
                rightPane.classList.remove('mobile-hidden-pane');
                rightPane.classList.remove('sticky-sidebar');
                mobTabSaved.classList.add('active');
                mobTabSearch.classList.remove('active');
            }
        }

        function getSavedWords() {
            const data = localStorage.getItem('saved_words');
            return data ? JSON.parse(data) : {};
        }

        function saveWord(kanji, romaji, meaning, tags, btnElement) {
            if (!kanji) return;
            
            if (btnElement) {
                btnElement.innerText = "Ekleniyor...";
                btnElement.disabled = true;
            }

            setTimeout(() => {
                let savedWords = getSavedWords();
                if (!savedWords[kanji]) {
                    savedWords[kanji] = {
                        level: 1,
                        timestamp: Date.now(),
                        romaji: romaji || '',
                        meaning: meaning || '',
                        tags: tags || '',
                        active: true
                    };
                    localStorage.setItem('saved_words', JSON.stringify(savedWords));
                }

                fetchSearchResults();
                renderSavedPanel();

                if (currentView === 'packs') {
                    refreshOpenPacks();
                }
            }, 10);
        }

        function removeWord(kanji, btnElement) {
            if (btnElement) {
                btnElement.innerText = "Çıkarılıyor...";
                btnElement.disabled = true;
            }

            let savedWords = getSavedWords();
            if (savedWords[kanji]) {
                delete savedWords[kanji];
                localStorage.setItem('saved_words', JSON.stringify(savedWords));
            }

            setTimeout(() => {
                if (btnElement) {
                    const rowCard = btnElement.closest('.flex.items-center.justify-between');
                    if (rowCard) {
                        rowCard.style.transition = "opacity 0.2s";
                        rowCard.style.opacity = "0";
                        setTimeout(() => rowCard.remove(), 200);
                    }
                }
                const badge = document.getElementById('savedCountBadge');
                if (badge) {
                    let currentCount = parseInt(badge.innerText) || 1;
                    badge.innerText = Math.max(0, currentCount - 1);
                }
                fetchSearchResults();
                if (currentView === 'packs') {
                    refreshOpenPacks();
                }
            }, 50);
        }

        function toggleActiveStatus(kanji) {
            let savedWords = getSavedWords();
            if (savedWords[kanji]) {
                savedWords[kanji].active = !savedWords[kanji].active;
                localStorage.setItem('saved_words', JSON.stringify(savedWords));
                renderSavedPanel();
            }
        }

        function toggleActiveStatusForSelectedTag() {
            let savedWords = getSavedWords();
            let allKeys = Object.keys(savedWords);
            if (allKeys.length === 0) return;

            let visibleWords = allKeys.filter(kanji => {
                let item = savedWords[kanji];
                if (currentSavedTagFilter === 'ALL') return true;
                if (!item.tags) return false;
                let vTags = filterDisplayTags(item.tags);
                return vTags.includes(currentSavedTagFilter);
            });

            allKeys.forEach(kanji => {
                if (visibleWords.includes(kanji)) {
                    savedWords[kanji].active = true;
                } else {
                    savedWords[kanji].active = false;
                }
            });

            localStorage.setItem('saved_words', JSON.stringify(savedWords));
            renderSavedPanel();
        }

        function filterDisplayTags(tagsString) {
            if (!tagsString) return [];
            return tagsString.split(',')
                .map(tag => tag.trim())
                .filter(tag => tag && !tag.toUpperCase().includes('DERS'));
        }

        async function loadWordPacks() {
            const container = document.getElementById('packsContainer');
            
            if (!packsLoadedOnce) {
                container.innerHTML = `<div class="text-center py-6 text-muted text-xs">Paketler yükleniyor...</div>`;
                try {
                    const response = await fetch(`/api/words`);
                    allWordsCache = await response.json();
                    packsLoadedOnce = true;
                } catch (err) {
                    console.error('Pack error:', err);
                    container.innerHTML = `<div class="text-center py-6 text-rose-primary text-xs card">Yüklenirken hata oluştu.</div>`;
                    return;
                }
            }

            let packsMap = {};
            allWordsCache.forEach(item => {
                if (!item.tags) return;
                let tags = item.tags.split(',').map(t => t.trim()).filter(t => t);
                tags.forEach(tag => {
                    if (!tag.toUpperCase().includes('DERS')) {
                        if (!packsMap[tag]) packsMap[tag] = [];
                        packsMap[tag].push(item);
                    }
                });
            });

            container.innerHTML = '';
            const keys = Object.keys(packsMap).sort();

            if (keys.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-muted text-xs card">Hiç etiketli kelime bulunamadı.</div>`;
                return;
            }

            keys.forEach(tag => {
                const wordsInPack = packsMap[tag];
                const packId = `pack_${tag.replace(/[^a-zA-Z0-9]/g, '_')}`;
                const isOpen = openPacksState.has(packId);

                let packHtml = `
                    <div class="card" style="padding: 0; overflow: hidden;">
                        <div style="padding: 0.75rem 1rem; background: rgba(248, 250, 252, 0.7); cursor: pointer;" class="flex items-center justify-between" onclick="togglePackDropdown('${packId}', '${tag.replace(/'/g, "\\'")}')">
                            <div class="flex items-center gap-2">
                                <span class="badge badge-indigo" style="font-size: 0.7rem;">${tag}</span>
                                <span class="text-dark font-medium text-xs">${wordsInPack.length} kelime</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="event.stopPropagation(); addAllPack('${tag.replace(/'/g, "\\'")}')" class="btn btn-indigo-light" style="padding: 0.25rem 0.5rem;">
                                    📦 Tümünü Ekle
                                </button>
                                <svg id="icon_${packId}" style="width: 1rem; height: 1rem; color: var(--text-light); transition: transform 0.2s; ${isOpen ? 'transform: rotate(180deg);' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </div>
                        </div>
                        <div id="${packId}" class="pack-list-container ${isOpen ? '' : 'hidden'}" style="border-top: 1px solid var(--border-light);">
                            ${isOpen ? '' : '<div style="padding: 0.75rem; text-align: center;" class="text-xs text-muted">İçerik hazırlanıyor...</div>'}
                        </div>
                    </div>
                `;
                container.innerHTML += packHtml;

                if (isOpen) {
                    renderPackWords(packId, tag);
                }
            });
        }

        function togglePackDropdown(packId, tag) {
            const dropdown = document.getElementById(packId);
            const icon = document.getElementById(`icon_${packId}`);
            
            const isHidden = dropdown.classList.contains('hidden');
            dropdown.classList.toggle('hidden');
            icon.classList.toggle('rotate-180');

            if (isHidden) {
                openPacksState.add(packId);
                renderPackWords(packId, tag);
            } else {
                openPacksState.delete(packId);
            }
        }

        function refreshOpenPacks() {
            loadWordPacks();
        }

        function renderPackWords(packId, tag) {
            const dropdown = document.getElementById(packId);
            const savedWords = getSavedWords();
            
            const wordsInPack = allWordsCache.filter(word => {
                if (!word.tags) return false;
                return word.tags.split(',').map(t => t.trim()).includes(tag);
            });

            let contentHtml = '';
            wordsInPack.forEach(word => {
                const isSaved = savedWords[word.word_kanji] !== undefined;

                contentHtml += `
                    <div style="padding: 0.625rem 0.875rem; border-bottom: 1px solid var(--border-light);" class="flex items-center justify-between">
                        <div>
                            <span class="font-bold text-dark text-sm" style="margin-right: 0.375rem;">${word.word_kanji}</span>
                            <span style="color: var(--indigo-primary); font-size: 0.8rem;">${word.word_kana || ''}</span>
                            <span class="text-muted text-xs" style="margin-left: 0.25rem;">(${word.word_romaji || ''})</span>
                            <div class="text-muted text-xs">${word.meaning}</div>
                        </div>
                        <div>
                            ${isSaved ? 
                                `<span style="color: var(--emerald-primary);" class="font-medium text-xs">✓ Kayıtlı</span>` : 
                                `<button onclick="saveWord('${word.word_kanji.replace(/'/g, "\\'")}', '${(word.word_romaji||'').replace(/'/g, "\\'")}', '${(word.meaning||'').replace(/'/g, "\\'")}', '${(word.tags||'').replace(/'/g, "\\'")}', this)" class="btn btn-indigo-light" style="padding: 0.25rem 0.5rem;">＋ Ekle</button>`
                            }
                        </div>
                    </div>
                `;
            });
            dropdown.innerHTML = contentHtml;
        }

        function addAllPack(tag) {
            const wordsToAdd = allWordsCache.filter(word => {
                return word.tags && word.tags.split(',').map(t => t.trim()).includes(tag);
            });

            if (wordsToAdd.length === 0) return;

            const modal = document.getElementById('processModal');
            const progressBar = document.getElementById('modalProgressBar');
            const progressText = document.getElementById('modalProgressText');
            const modalTitle = document.getElementById('modalTitle');
            const modalDesc = document.getElementById('modalDesc');

            modal.classList.remove('hidden');
            modalTitle.innerText = `"${tag}" Paketi Ekleniyor...`;

            let index = 0;
            let savedWords = getSavedWords();
            const total = wordsToAdd.length;
            const batchSize = 100;

            function processNextBatch() {
                let limit = Math.min(index + batchSize, total);
                
                while (index < limit) {
                    let word = wordsToAdd[index];
                    if (!savedWords[word.word_kanji]) {
                        savedWords[word.word_kanji] = {
                            level: 1,
                            timestamp: Date.now(),
                            romaji: word.word_romaji || '',
                            meaning: word.meaning || '',
                            tags: word.tags || '',
                            active: true
                        };
                    }
                    index++;
                }

                let percent = Math.round((index / total) * 100);
                progressBar.style.width = percent + '%';
                progressText.innerText = `${index} / ${total} (${percent}%)`;

                if (index < total) {
                    setTimeout(processNextBatch, 5);
                } else {
                    localStorage.setItem('saved_words', JSON.stringify(savedWords));
                    setTimeout(() => {
                        modal.classList.add('hidden');
                        fetchSearchResults();
                        savedVisibleLimit = 40; 
                        renderSavedPanel();
                        if (currentView === 'packs') {
                            loadWordPacks();
                        }
                    }, 200);
                }
            }

            setTimeout(processNextBatch, 10);
        }

        function renderSavedTagFilters(savedWords) {
            const filterContainer = document.getElementById('savedTagFiltersContainer');
            let tagsSet = new Set();

            Object.keys(savedWords).forEach(kanji => {
                let item = savedWords[kanji];
                let vTags = filterDisplayTags(item.tags);
                vTags.forEach(t => tagsSet.add(t));
            });

            let tagsArr = Array.from(tagsSet).sort();

            let html = `<button onclick="setSavedTagFilter('ALL')" class="tag-filter-btn ${currentSavedTagFilter === 'ALL' ? 'active' : ''}">Hepsi</button>`;
            tagsArr.forEach(tag => {
                html += `<button onclick="setSavedTagFilter('${tag}')" class="tag-filter-btn ${currentSavedTagFilter === tag ? 'active' : ''}">${tag}</button>`;
            });

            filterContainer.innerHTML = html;
        }

        function setSavedTagFilter(tag) {
            currentSavedTagFilter = tag;
            savedVisibleLimit = 40; 
            renderSavedPanel();
        }

        function handleSavedScroll(element) {
            if (element.scrollTop + element.clientHeight >= element.scrollHeight - 20) {
                savedVisibleLimit += savedBatchSize;
                renderSavedPanel(true); 
            }
        }

        function renderSavedPanel(isAppending = false) {
            const savedWords = getSavedWords();
            const container = document.getElementById('savedWordsContainer');
            const badge = document.getElementById('savedCountBadge');
            
            if (!isAppending) {
                renderSavedTagFilters(savedWords);
            }

            const sortedWords = Object.keys(savedWords).map(kanji => {
                return { kanji, ...savedWords[kanji] };
            }).sort((a, b) => b.timestamp - a.timestamp);

            let filteredWords = sortedWords.filter(item => {
                if (currentSavedTagFilter === 'ALL') return true;
                let vTags = filterDisplayTags(item.tags);
                return vTags.includes(currentSavedTagFilter);
            });

            badge.innerText = filteredWords.length;

            if (filteredWords.length === 0) {
                container.innerHTML = `<p class="text-muted text-xs text-center py-6">Kayıtlı kelime bulunamadı.</p>`;
                return;
            }

            const slicedWords = filteredWords.slice(0, savedVisibleLimit);

            let htmlContent = '';
            slicedWords.forEach(item => {
                const isActive = item.active !== false;
                htmlContent += `
                    <div style="background: #f8fafc; border: 1px solid var(--border-light); padding: 0.625rem; border-radius: 0.5rem; word-break: break-word;" class="flex items-center justify-between gap-2 text-xs">
                        <div class="flex items-center gap-2" style="overflow: hidden; flex: 1; min-width: 0;">
                            <input type="checkbox" ${isActive ? 'checked' : ''} onclick="toggleActiveStatus('${item.kanji.replace(/'/g, "\\'")}')" 
                                title="Etkinliklerde sorulsun mu?" style="width: 0.875rem; height: 0.875rem; accent-color: var(--indigo-primary); cursor: pointer; flex-shrink: 0;">
                            
                            <div style="overflow: hidden; flex: 1; min-width: 0;">
                                <div class="flex items-center gap-1 flex-wrap">
                                    <span class="font-bold text-dark text-sm">${item.kanji}</span>
                                    <span style="font-size: 0.65rem; color: var(--text-light);">(${item.romaji})</span>
                                </div>
                                <div class="text-muted" style="word-break: break-word; overflow-wrap: break-word;" title="${item.meaning}">${item.meaning}</div>
                                <div style="margin-top: 0.125rem;" class="flex items-center gap-1 flex-wrap">
                                    <span class="badge badge-indigo" style="font-size: 0.6rem;">Lvl ${item.level}/20</span>
                                    ${!isActive ? '<span style="font-size: 0.6rem; color: var(--amber-primary); background: var(--amber-bg); padding: 0.1rem 0.25rem; border-radius: 0.25rem;">Pasif</span>' : ''}
                                </div>
                            </div>
                        </div>
                        <button onclick="removeWord('${item.kanji.replace(/'/g, "\\'")}', this)" class="btn btn-rose-light" style="padding: 0.25rem 0.5rem; flex-shrink: 0;">
                            Çıkar
                        </button>
                    </div>
                `;
            });

            if (savedVisibleLimit < filteredWords.length) {
                htmlContent += `<div class="text-center py-2 text-xs text-muted">Daha fazlası için aşağı kaydırın (${savedVisibleLimit}/${filteredWords.length})...</div>`;
            }

            container.innerHTML = htmlContent;
        }

        const searchInput = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('resultsContainer');

        async function fetchSearchResults() {
            const searchQuery = searchInput.value;
            const savedWords = getSavedWords();

            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(searchQuery)}`);
                const data = await response.json();
                
                resultsContainer.innerHTML = '';
                
                if (data.length === 0) {
                    resultsContainer.innerHTML = `<div class="text-center py-8 text-muted text-sm card">Sonuç bulunamadı 🥲</div>`;
                    return;
                }

                data.forEach(item => {
                    const validTags = filterDisplayTags(item.tags);
                    let tagsHtml = validTags.map(tag => `<span class="badge badge-indigo" style="margin-right: 0.25rem;">${tag}</span>`).join('');

                    const kanjiKey = item.word_kanji;
                    const isSaved = savedWords[kanjiKey] !== undefined;

                    let saveButtonHtml = '';
                    if (isSaved) {
                        saveButtonHtml = `
                            <span class="badge badge-emerald" style="padding: 0.35rem 0.625rem; font-weight: 500; display: flex; align-items: center; gap: 0.25rem;">
                                ✓ Kaydedildi (Lvl ${savedWords[kanjiKey].level}/20)
                            </span>
                        `;
                    } else {
                        const safeKanji = kanjiKey.replace(/'/g, "\\'");
                        const safeRomaji = (item.word_romaji || '').replace(/'/g, "\\'");
                        const safeMeaning = (item.meaning || '').replace(/'/g, "\\'");
                        const safeTags = (item.tags || '').replace(/'/g, "\\'");

                        saveButtonHtml = `
                            <button onclick="saveWord('${safeKanji}', '${safeRomaji}', '${safeMeaning}', '${safeTags}', this)" class="btn btn-indigo-light">
                                ＋ Ekle
                            </button>
                        `;
                    }

                    const html = `
                        <div class="card-padded">
                            <div class="flex justify-between items-start" style="margin-bottom: 0.5rem;">
                                <div>
                                    <span style="font-size: 1.5rem;" class="font-bold text-dark" style="margin-right: 0.5rem;">${item.word_kanji || ''}</span>
                                    <span class="text-base font-medium" style="color: var(--indigo-primary);">${item.word_kana || ''}</span>
                                    <span class="text-xs text-muted" style="margin-left: 0.375rem;">(${item.word_romaji || ''})</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="badge badge-gray">${item.pos || ''}</span>
                                    ${saveButtonHtml}
                                </div>
                            </div>
                            
                            <div class="text-base font-medium text-dark" style="margin-bottom: 0.75rem;">
                                ${item.meaning}
                            </div>

                            ${item.example_kana ? `
                                <div style="background: #f8fafc; padding: 0.625rem; border-radius: 0.5rem; border: 1px solid var(--border-light); margin-bottom: 0.625rem;" class="text-xs space-y-1">
                                    <div class="font-medium text-dark">${item.example_kana}</div>
                                    <div class="text-muted" style="font-size: 0.6875rem;">${item.example_romaji || ''}</div>
                                    <div class="text-muted" style="font-style: italic;">"${item.example_meaning || ''}"</div>
                                </div>
                            ` : ''}

                            <div style="display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.25rem;">
                                ${tagsHtml}
                            </div>
                        </div>
                    `;
                    resultsContainer.innerHTML += html;
                });

            } catch (error) {
                console.error('Search error:', error);
            }
        }

        searchInput.addEventListener('input', fetchSearchResults);
        fetchSearchResults();
        renderSavedPanel();
    </script>
    <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js');
    });
  }
</script>
</body>
</html>
