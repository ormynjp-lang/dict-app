<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japonca Kelime Etkinliği</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --border-color: #e2e8f0;
            --border-light: #f1f5f9;
            --indigo-primary: #4f46e5;
            --indigo-bg: #e0e7ff;
            --emerald-primary: #059669;
            --emerald-bg: #d1fae5;
            --rose-primary: #e11d48;
            --rose-bg: #ffe4e6;
            --amber-primary: #d97706;
            --amber-bg: #fef3c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: var(--bg-color);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 1.5rem 0;
    position: relative;
    overflow-x: hidden;
}

        .hidden { display: none !important; }
        .rotate-180 { transform: rotate(180deg); }

        /* Navbar */
header {
    width: 100%;
    background: var(--card-bg);
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border-color);
    box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
    margin-bottom: 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

        .brand-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-icon {
            font-size: 1.5rem;
            padding: 0.5rem;
            background: var(--emerald-bg);
            border-radius: 0.75rem;
        }

        /* Main Container */
        main {
            width: 100%;
            max-width: 48rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        /* Cards & Panels */
        .card {
            background: var(--card-bg);
            border-radius: 1rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .card-padded {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 1rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
        }

        /* Buttons & Options */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.375rem;
            padding: 0.625rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.8125rem;
            font-weight: 600;
            text-decoration: none;
            border: 1px solid var(--border-color);
            background: #f1f5f9;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn:hover { background: #e2e8f0; }

        .btn-primary {
            background: var(--indigo-primary);
            color: #fff;
            border-color: var(--indigo-primary);
        }
        .btn-primary:hover { background: #4338ca; }

        .btn-emerald {
            background: var(--emerald-primary);
            color: #fff;
            border-color: var(--emerald-primary);
        }
        .btn-emerald:hover { background: #047857; }

        .option-btn {
            width: 100%;
            padding: 0.875rem 1rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border-color);
            background: #ffffff;
            font-weight: 500;
            font-size: 0.875rem;
            color: var(--text-dark);
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 2px 0 rgba(0,0,0,0.02);
            font-family: inherit;
        }
        .option-btn:hover:not(:disabled) { background: #f8fafc; border-color: var(--indigo-primary); }

        .option-correct {
            border-color: var(--emerald-primary) !important;
            background: var(--emerald-bg) !important;
            color: #065f46 !important;
        }
        .option-wrong {
            border-color: var(--rose-primary) !important;
            background: var(--rose-bg) !important;
            color: #9f1239 !important;
        }

        /* Config Grids */
        .config-grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
        }
        .config-grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
        }
        .config-grid-5 {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.5rem;
        }

        .config-btn {
            padding: 0.625rem 0.5rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border-color);
            background: #ffffff;
            color: var(--text-main);
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            font-family: inherit;
        }
        .config-btn:hover { background: #f8fafc; }
        .config-btn.active {
            border-color: var(--indigo-primary);
            background: var(--indigo-bg);
            color: var(--indigo-primary);
            font-weight: 600;
        }

        /* Saved Words Selector Grid */
        .saved-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.625rem;
            max-height: 16rem;
            overflow-y: auto;
            padding-right: 0.25rem;
        }
        @media (min-width: 768px) {
            .saved-grid { grid-template-columns: repeat(2, 1fr); }
        }

        /* Badges */
        .badge {
            font-size: 0.6875rem;
            padding: 0.125rem 0.5rem;
            border-radius: 9999px;
            font-weight: 600;
            display: inline-block;
        }
        .badge-indigo { background: var(--indigo-bg); color: var(--indigo-primary); }
        .badge-amber { background: var(--amber-bg); color: var(--amber-primary); }

        /* Typography & Spacing */
        .text-xs { font-size: 0.75rem; }
        .text-sm { font-size: 0.875rem; }
        .text-base { font-size: 1rem; }
        .font-bold { font-weight: 700; }
        .font-medium { font-weight: 500; }
        .text-muted { color: var(--text-muted); }
        .text-dark { color: var(--text-dark); }
        
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .gap-1 { gap: 0.25rem; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-4 { gap: 1rem; }
        .space-y-3 > * + * { margin-top: 0.75rem; }
        .space-y-4 > * + * { margin-top: 1rem; }
        .space-y-5 > * + * { margin-top: 1.25rem; }
    </style>
</head>
<body>

    <!-- Navbar -->
<!-- Navbar -->
<header>
    <div class="brand-container">
        <span class="brand-icon">⚡</span>
        <div>
            <h1 class="font-bold text-dark text-sm" style="line-height: 1.2;">Kelime Çalışma & Test Paneli</h1>
            <p class="text-xs text-muted">Aralıklı tekrar ve pratik yapma alanı</p>
        </div>
    </div>
    <a href="/" class="btn">
        ← Ana Sayfa
    </a>
</header>

    <!-- Main Container -->
    <main>

        <!-- COLLAPSIBLE WORD SELECTOR PANEL -->
        <div class="card">
            <button onclick="toggleWordSelector()" style="width: 100%; padding: 1rem; background: rgba(248,250,252,0.7); border: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; text-align: left; font-family: inherit;">
                <div class="flex items-center gap-3">
                    <span style="font-size: 1.25rem;">📚</span>
                    <div>
                        <span class="font-bold text-dark text-xs md:text-sm">Çalışılacak Kelimeleri Seç / Düzenle</span>
                        <p class="text-xs text-muted">Etkinlikte sorulacak kelimeleri buradan seçin veya pasifleştirin.</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <span id="savedCountBadge" class="badge badge-indigo">0 / 0 aktif</span>
                    <svg id="selectorIcon" style="width: 1rem; height: 1rem; color: var(--text-muted); transition: transform 0.2s;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
            </button>

            <div id="wordSelectorBody" class="hidden" style="padding: 1rem; border-top: 1px solid var(--border-light); background: #ffffff;">
                <div id="savedWordsContainer" class="saved-grid">
                    <!-- Dynamic saved words will load here -->
                </div>
            </div>
        </div>

        <!-- SETUP SCREEN -->
        <div id="setupScreen" class="card-padded space-y-4">
            <h2 class="font-bold text-sm text-dark" style="border-bottom: 1px solid var(--border-light); padding-bottom: 0.75rem;">Etkinlik Ayarları</h2>
            
            <!-- Soru Tipi -->
            <div>
                <label class="block text-xs font-bold text-muted" style="margin-bottom: 0.5rem;">Soru Tipi</label>
                <div class="config-grid-3">
                    <button onclick="setQuizType('meaning_to_kanji')" id="type_meaning_to_kanji" class="config-btn active">Anlam → Kanji</button>
                    <button onclick="setQuizType('kanji_to_meaning')" id="type_kanji_to_meaning" class="config-btn">Kanji → Anlam</button>
                    <button onclick="setQuizType('mixed')" id="type_mixed" class="config-btn">Karışık</button>
                </div>
            </div>

            <!-- Okuma Yardımı -->
<div>
                <label class="block text-xs font-bold text-muted" style="margin-bottom: 0.5rem;">Okuma Yardımı (İpucu)</label>
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem;">
                    <button onclick="setReadingHelp('none')" id="help_none" class="config-btn active">Hiçbiri</button>
                    <button onclick="setReadingHelp('kana')" id="help_kana" class="config-btn" style="display: none;">Hiragana (Kana)</button>
                    <button onclick="setReadingHelp('romaji')" id="help_romaji" class="config-btn">Romaji</button>
                </div>
            </div>

            <!-- Seviye Filtresi -->
            <div>
                <label class="block text-xs font-bold text-muted" style="margin-bottom: 0.5rem;">Seviye Filtresi</label>
                <div class="config-grid-4">
                    <button onclick="setLevelFilter('all')" id="lvl_all" class="config-btn active">Tümü</button>
                    <button onclick="setLevelFilter('low')" id="lvl_low" class="config-btn">&lt; 7 Seviye</button>
                    <button onclick="setLevelFilter('mid')" id="lvl_mid" class="config-btn">7 - 15</button>
                    <button onclick="setLevelFilter('high')" id="lvl_high" class="config-btn">&gt; 15 Seviye</button>
                </div>
            </div>

            <!-- Soru Sayısı -->
            <div>
                <label class="block text-xs font-bold text-muted" style="margin-bottom: 0.5rem;">Soru Sayısı</label>
                <div class="config-grid-5">
                    <button onclick="setQuestionCount(10)" id="q_10" class="config-btn active">10</button>
                    <button onclick="setQuestionCount(15)" id="q_15" class="config-btn">15</button>
                    <button onclick="setQuestionCount(20)" id="q_20" class="config-btn">20</button>
                    <button onclick="setQuestionCount(30)" id="q_30" class="config-btn">30</button>
                    <button onclick="setQuestionCount(50)" id="q_50" class="config-btn">50</button>
                </div>
            </div>

            <button onclick="startQuiz()" class="btn btn-emerald" style="width: 100%; padding: 0.875rem; font-size: 0.875rem; margin-top: 0.5rem;">
                🚀 Etkinliği Başlat
            </button>
        </div>

        <!-- QUIZ SCREEN (Hidden initially) -->
        <div id="quizScreen" class="hidden card-padded space-y-5">
            <div class="flex justify-between items-center text-xs font-semibold text-muted" style="border-bottom: 1px solid var(--border-light); padding-bottom: 0.75rem;">
                <span id="questionProgress">Soru 1 / 10</span>
                <div class="flex items-center gap-1.5" style="background: #f1f5f9; padding: 0.25rem 0.75rem; border-radius: 9999px;">
                    <span>⏱️</span> <span id="timerDisplay" style="font-family: monospace; color: var(--text-dark);">00:00</span>
                </div>
            </div>

            <div style="text-align: center; padding: 1rem 0;" class="space-y-2">
                <div id="readingHelpContainer" style="font-size: 0.75rem; color: var(--indigo-primary); font-weight: 500; height: 1.25rem;"></div>
                <div id="questionPrompt" style="font-size: 1.875rem; font-weight: 700; color: var(--text-dark); min-height: 3.125rem; display: flex; align-items: center; justify-content: center;"></div>
                <div id="questionSubtext" class="text-xs text-muted">Doğru şıkkı seçin</div>
            </div>

            <div id="optionsContainer" style="display: flex; flex-direction: column; gap: 0.625rem;"></div>
        </div>

        <!-- REPORT SCREEN (Hidden initially) -->
        <div id="reportScreen" class="hidden card-padded space-y-5">
            <div style="text-align: center; border-bottom: 1px solid var(--border-light); padding-bottom: 1rem;" class="space-y-2">
                <span style="font-size: 2.25rem;">🎉</span>
                <h2 class="font-bold text-base text-dark">Etkinlik Tamamlandı!</h2>
                <p class="text-xs text-muted">Çalışma raporun aşağıda listelenmiştir.</p>
            </div>

            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; text-align: center;">
                <div style="background: #f8fafc; padding: 0.75rem; border-radius: 0.75rem; border: 1px solid var(--border-light);">
                    <div class="text-xs text-muted">Doğru</div>
                    <div id="reportCorrect" style="font-size: 1.125rem; font-weight: 700; color: var(--emerald-primary);">0</div>
                </div>
                <div style="background: #f8fafc; padding: 0.75rem; border-radius: 0.75rem; border: 1px solid var(--border-light);">
                    <div class="text-xs text-muted">Yanlış</div>
                    <div id="reportWrong" style="font-size: 1.125rem; font-weight: 700; color: var(--rose-primary);">0</div>
                </div>
                <div style="background: #f8fafc; padding: 0.75rem; border-radius: 0.75rem; border: 1px solid var(--border-light);">
                    <div class="text-xs text-muted">Süre</div>
                    <div id="reportTime" style="font-size: 1.125rem; font-weight: 700; color: var(--indigo-primary);">00:00</div>
                </div>
            </div>

            <div>
                <h3 class="font-bold text-xs text-dark" style="margin-bottom: 0.5rem;">Soru Detayları</h3>
                <div id="reportDetailsList" class="space-y-2" style="max-height: 15rem; overflow-y: auto; padding-right: 0.25rem; font-size: 0.75rem;"></div>
            </div>

            <button onclick="resetToSetup()" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
                🔄 Yeni Etkinlik Kur
            </button>
        </div>

    </main>

    <!-- JavaScript Logic -->
    <script>
        let config = {
            type: 'meaning_to_kanji',
            help: 'none',
            levelFilter: 'all',
            count: 10
        };

        let quizState = {
            questions: [],
            currentIndex: 0,
            correctCount: 0,
            wrongCount: 0,
            details: [],
            timerInterval: null,
            secondsElapsed: 0
        };

        let isWordSelectorLoaded = false;

        function toggleWordSelector() {
            const body = document.getElementById('wordSelectorBody');
            const icon = document.getElementById('selectorIcon');
            body.classList.toggle('hidden');
            icon.classList.toggle('rotate-180');

            if (!body.classList.contains('hidden') && !isWordSelectorLoaded) {
                renderSavedPanel();
                isWordSelectorLoaded = true;
            }
        }

        // --- Config Setters ---
        function setQuizType(type) {
            config.type = type;
            ['meaning_to_kanji', 'kanji_to_meaning', 'mixed'].forEach(t => {
                const btn = document.getElementById(`type_${t}`);
                btn.className = t === type ? "config-btn active" : "config-btn";
            });
        }

        function setReadingHelp(help) {
            config.help = help;
            ['none', 'kana', 'romaji'].forEach(h => {
                const btn = document.getElementById(`help_${h}`);
                btn.className = h === help ? "config-btn active" : "config-btn";
            });
        }

        function setLevelFilter(filter) {
            config.levelFilter = filter;
            ['all', 'low', 'mid', 'high'].forEach(f => {
                const btn = document.getElementById(`lvl_${f}`);
                btn.className = f === filter ? "config-btn active" : "config-btn";
            });
        }

        function setQuestionCount(count) {
            config.count = count;
            [10, 15, 20, 30, 50].forEach(c => {
                const btn = document.getElementById(`q_${c}`);
                btn.className = c === count ? "config-btn active" : "config-btn";
            });
        }

        function getSavedWords() {
            const data = localStorage.getItem('saved_words');
            return data ? JSON.parse(data) : {};
        }

        function updateWordLevel(kanji, change) {
            let savedWords = getSavedWords();
            if (savedWords[kanji]) {
                let newLevel = (savedWords[kanji].level || 1) + change;
                if (newLevel < 0) newLevel = 0;
                savedWords[kanji].level = newLevel;
                localStorage.setItem('saved_words', JSON.stringify(savedWords));
                if (isWordSelectorLoaded) renderSavedPanel();
            }
        }

        function toggleActiveStatus(kanji) {
            let savedWords = getSavedWords();
            if (savedWords[kanji]) {
                savedWords[kanji].active = !savedWords[kanji].active;
                localStorage.setItem('saved_words', JSON.stringify(savedWords));
                renderSavedPanel();
            }
        }

        function removeWord(kanji) {
            let savedWords = getSavedWords();
            if (savedWords[kanji]) {
                delete savedWords[kanji];
                localStorage.setItem('saved_words', JSON.stringify(savedWords));
                renderSavedPanel();
                updateBadgeCount();
            }
        }

        function updateBadgeCount() {
            const savedWords = getSavedWords();
            const entries = Object.values(savedWords);
            const totalCount = entries.length;
            const activeCount = entries.filter(item => item.active !== false).length;
            document.getElementById('savedCountBadge').innerText = `${totalCount} kelime (${activeCount} aktif)`;
        }

        function renderSavedPanel() {
            const savedWords = getSavedWords();
            const container = document.getElementById('savedWordsContainer');
            container.innerHTML = '';
            
            const sortedWords = Object.keys(savedWords).map(kanji => {
                return { kanji, ...savedWords[kanji] };
            }).sort((a, b) => b.timestamp - a.timestamp);

            updateBadgeCount();

            if (sortedWords.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: span 2; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; gap: 0.75rem;">
                        <p class="text-muted text-xs text-center">Henüz kaydedilmiş kelime yok.</p>
                        <a href="/" class="btn" style="font-size: 0.75rem; padding: 0.375rem 0.75rem;">
                            Sözlüğe Git ve Kaydet
                        </a>
                    </div>
                `;
                return;
            }

            sortedWords.forEach(item => {
                const isActive = item.active !== false;
                const cardHtml = `
                    <div style="background: #f8fafc; border: 1px solid var(--border-light); padding: 0.625rem; border-radius: 0.5rem;" class="flex items-center justify-between gap-2 text-xs">
                        <div class="flex items-center gap-2" style="overflow: hidden;">
                            <input type="checkbox" ${isActive ? 'checked' : ''} onclick="toggleActiveStatus('${item.kanji.replace(/'/g, "\\'")}')" 
                                title="Etkinlikte sorulsun mu?" style="width: 0.875rem; height: 0.875rem; accent-color: var(--indigo-primary); cursor: pointer; flex-shrink: 0;">
                            
                            <div style="overflow: hidden;">
                                <div class="flex items-center gap-1">
                                    <span class="font-bold text-dark text-sm">${item.kanji}</span>
                                    <span class="text-xs text-muted">(${item.romaji})</span>
                                </div>
                                <div class="text-muted" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px;" title="${item.meaning}">${item.meaning}</div>
                                <div style="margin-top: 0.125rem;" class="flex items-center gap-1">
                                    <span class="badge badge-indigo">Lvl ${item.level}/20</span>
                                    ${!isActive ? '<span style="font-size: 0.6rem; color: var(--amber-primary); background: var(--amber-bg); padding: 0.1rem 0.25rem; border-radius: 0.25rem;">Pasif</span>' : ''}
                                </div>
                            </div>
                        </div>
                        <button onclick="removeWord('${item.kanji.replace(/'/g, "\\'")}')" style="background: var(--rose-bg); color: var(--rose-primary); border: 1px solid #fecdd3; padding: 0.25rem 0.5rem; border-radius: 0.375rem; font-size: 0.7rem; font-weight: 600; cursor: pointer; flex-shrink: 0;">
                            Çıkar
                        </button>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        function recordQuizCompletion() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            const formattedDate = `${day}.${month}.${year}`;
            localStorage.setItem('last_quiz_date', formattedDate);
        }

        function startQuiz() {
            const body = document.getElementById('wordSelectorBody');
            const icon = document.getElementById('selectorIcon');
            if (!body.classList.contains('hidden')) {
                body.classList.add('hidden');
                icon.classList.remove('rotate-180');
            }

            const savedWords = getSavedWords();
            
            let pool = Object.keys(savedWords).map(kanji => {
                return { kanji, ...savedWords[kanji] };
            }).filter(item => {
                if (item.active === false) return false;
                const lvl = item.level || 1;
                if (config.levelFilter === 'low' && lvl >= 7) return false;
                if (config.levelFilter === 'mid' && (lvl < 7 || lvl > 15)) return false;
                if (config.levelFilter === 'high' && lvl <= 15) return false;
                return true;
            });

            if (pool.length < 4) {
                alert("Etkinlik başlatmak için en az 4 adet uygun ve aktif kelimeniz olmalı!");
                return;
            }

            pool.sort(() => Math.random() - 0.5);
            const selectedWords = pool.slice(0, config.count);

            quizState.questions = selectedWords.map(word => {
                let qType = config.type;
                if (qType === 'mixed') {
                    qType = Math.random() < 0.5 ? 'meaning_to_kanji' : 'kanji_to_meaning';
                }

                let wrongPool = pool.filter(w => w.kanji !== word.kanji);
                wrongPool.sort(() => Math.random() - 0.5);
                let wrongChoices = wrongPool.slice(0, 3);

                return {
                    target: word,
                    type: qType,
                    wrongChoices: wrongChoices
                };
            });

            quizState.currentIndex = 0;
            quizState.correctCount = 0;
            quizState.wrongCount = 0;
            quizState.details = [];
            quizState.secondsElapsed = 0;

            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('quizScreen').classList.remove('hidden');

            clearInterval(quizState.timerInterval);
            quizState.timerInterval = setInterval(() => {
                quizState.secondsElapsed++;
                let mins = Math.floor(quizState.secondsElapsed / 60).toString().padStart(2, '0');
                let secs = (quizState.secondsElapsed % 60).toString().padStart(2, '0');
                document.getElementById('timerDisplay').innerText = `${mins}:${secs}`;
            }, 1000);

            loadQuestion();
        }

        function loadQuestion() {
            if (quizState.currentIndex >= quizState.questions.length) {
                endQuiz();
                return;
            }

            const qData = quizState.questions[quizState.currentIndex];
            document.getElementById('questionProgress').innerText = `Soru ${quizState.currentIndex + 1} / ${quizState.questions.length}`;

            const promptEl = document.getElementById('questionPrompt');
            const subtextEl = document.getElementById('questionSubtext');
            const helpEl = document.getElementById('readingHelpContainer');
            const optionsEl = document.getElementById('optionsContainer');

            optionsEl.innerHTML = '';
            helpEl.innerHTML = '';

            if (config.help === 'kana' && qData.target.kana) {
                helpEl.innerText = `Okunuş: ${qData.target.kana}`;
            } else if (config.help === 'romaji' && qData.target.romaji) {
                helpEl.innerText = `Okunuş: ${qData.target.romaji}`;
            }

            let correctAnswerText = '';
            let choices = [];

            if (qData.type === 'meaning_to_kanji') {
                subtextEl.innerText = "Anlamına gelen KANJI'yi seçin:";
                promptEl.innerText = qData.target.meaning;
                correctAnswerText = qData.target.kanji;

                choices = [
                    { text: qData.target.kanji, isCorrect: true },
                    ...qData.wrongChoices.map(w => ({ text: w.kanji, isCorrect: false }))
                ];
            } else {
                subtextEl.innerText = "Kanji'nin ANLAMINI seçin:";
                promptEl.innerText = qData.target.kanji;
                correctAnswerText = qData.target.meaning;

                choices = [
                    { text: qData.target.meaning, isCorrect: true },
                    ...qData.wrongChoices.map(w => ({ text: w.meaning, isCorrect: false }))
                ];
            }

            choices.sort(() => Math.random() - 0.5);

            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = "option-btn";
                btn.innerHTML = `<span>${choice.text}</span>`;
                btn.onclick = () => handleAnswer(choice.isCorrect, btn, choices, correctAnswerText, qData.target);
                optionsEl.appendChild(btn);
            });
        }

        function handleAnswer(isCorrect, selectedBtn, allChoices, correctText, targetWord) {
            const buttons = document.getElementById('optionsContainer').getElementsByTagName('button');
            for (let b of buttons) {
                b.disabled = true;
                if (b.innerText.trim() === correctText.trim()) {
                    b.className = "option-btn option-correct";
                }
            }

            if (isCorrect) {
                selectedBtn.className = "option-btn option-correct";
                quizState.correctCount++;
                updateWordLevel(targetWord.kanji, +1);
                quizState.details.push({ word: targetWord.kanji, meaning: targetWord.meaning, correct: true });
            } else {
                selectedBtn.className = "option-btn option-wrong";
                quizState.wrongCount++;
                updateWordLevel(targetWord.kanji, -1);
                quizState.details.push({ word: targetWord.kanji, meaning: targetWord.meaning, correct: false });
            }

            setTimeout(() => {
                quizState.currentIndex++;
                loadQuestion();
            }, 1200);
        }

        function endQuiz() {
            clearInterval(quizState.timerInterval);
            recordQuizCompletion();

            document.getElementById('quizScreen').classList.add('hidden');
            document.getElementById('reportScreen').classList.remove('hidden');

            document.getElementById('reportCorrect').innerText = quizState.correctCount;
            document.getElementById('reportWrong').innerText = quizState.wrongCount;

            let mins = Math.floor(quizState.secondsElapsed / 60).toString().padStart(2, '0');
            let secs = (quizState.secondsElapsed % 60).toString().padStart(2, '0');
            document.getElementById('reportTime').innerText = `${mins}:${secs}`;

            const detailsContainer = document.getElementById('reportDetailsList');
            detailsContainer.innerHTML = '';

            quizState.details.forEach(item => {
                const bgStyle = item.correct ? 'background: var(--emerald-bg); border-color: #a7f3d0; color: #065f46;' : 'background: var(--rose-bg); border-color: #fecdd3; color: #9f1239;';
                detailsContainer.innerHTML += `
                    <div style="padding: 0.5rem 0.75rem; border-radius: 0.5rem; border: 1px solid; ${bgStyle}" class="flex justify-between items-center">
                        <div>
                            <span class="font-bold text-sm" style="margin-right: 0.375rem;">${item.word}</span>
                            <span class="text-muted">${item.meaning}</span>
                        </div>
                        <span class="font-semibold">${item.correct ? '✓ Doğru' : '✕ Yanlış'}</span>
                    </div>
                `;
            });
        }

        function resetToSetup() {
            document.getElementById('reportScreen').classList.add('hidden');
            document.getElementById('setupScreen').classList.remove('hidden');
            if (isWordSelectorLoaded) renderSavedPanel();
        }

        updateBadgeCount();
    </script>
</body>
</html>
